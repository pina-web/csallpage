<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#1C1C1C;
    --sub:#8A857C;
    --tile:#F2F1EE;
    --tile-hover:#E8E5DF;
    --line:#EAE8E3;
    --accent:#B9AC98;
    --f:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;
       -webkit-text-size-adjust:100%}

  .page{max-width:1180px;margin:0 auto;padding:46px 28px 70px}

  /* ── 머리말 ── */
  .head{text-align:center;margin:0 0 42px}
  .head h1{margin:0;font-size:35px;font-weight:600;letter-spacing:-.035em;line-height:1.25}
  .head h1 em{font-style:normal;font-weight:500;margin-left:6px}
  .head p{margin:12px 0 0;font-size:14px;color:var(--sub);letter-spacing:-.02em}

  /* ── 본문 2단 ── */
  .grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:56px;align-items:start}
  .hero{width:100%;height:auto;display:block;border-radius:2px}

  .groups{display:flex;flex-direction:column;gap:30px;padding-top:4px}
  .group > h2{
    display:flex;align-items:center;gap:9px;margin:0 0 13px;
    font-size:15px;font-weight:600;letter-spacing:-.03em;color:var(--ink);
  }
  .group > h2::before{
    content:"";width:8px;height:8px;flex:0 0 auto;background:var(--accent);
    transform:rotate(45deg);border-radius:1px;
  }
  .tiles{display:flex;flex-wrap:wrap;gap:12px}

  .tile{
    flex:0 0 auto;min-width:113px;min-height:74px;padding:14px 16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--tile);border:1px solid transparent;border-radius:9px;
    color:#45403A;text-decoration:none;text-align:center;
    font-size:13px;font-weight:600;letter-spacing:-.03em;line-height:1.42;
    transition:background-color .16s ease,transform .16s ease,border-color .16s ease;
  }
  .tile:hover{background:var(--tile-hover);transform:translateY(-2px)}
  .tile:active{transform:translateY(0)}
  .tile:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  .tile.soon{color:#B3ADA3;background:#F8F7F5;cursor:default}
  .tile.soon:hover{background:#F8F7F5;transform:none}

  /* happytalk 타일 */
  .tile.ht{gap:7px}
  .ht-mark{width:30px;height:30px;border-radius:50%;background:#2BBBD8;position:relative;display:block}
  .ht-mark::after{content:"";position:absolute;left:7px;top:9px;width:16px;height:10px;border-radius:50%;background:#fff}
  .ht-name{font-size:13px;font-weight:700;letter-spacing:-.02em;color:#2A2622}
  .tile.soon .ht-name{color:#B3ADA3}
  .tile.soon .ht-mark{opacity:.45}

  /* ── 꼬리말 ── */
  .foot{margin:56px 0 0;text-align:center;font-size:12.5px;color:#A49E95;letter-spacing:-.02em}

  @media(max-width:900px){
    .page{padding:30px 18px 56px}
    .head h1{font-size:27px}
    .grid{grid-template-columns:1fr;gap:34px}
    .hero{max-width:420px;margin:0 auto}
    .tiles{gap:9px}
    .tile{min-width:0;flex:1 1 calc(33.333% - 6px);min-height:66px;padding:11px 8px;font-size:12px}
  }
  @media(max-width:420px){
    .tile{flex:1 1 calc(50% - 5px)}
  }
  @media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>

<div class="page">

  <header class="head">
    <h1>아르떼조명<em>CS 상담자료</em></h1>
    <p>아르떼조명 상담용 교육자료 모음</p>
